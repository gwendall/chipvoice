name: production e2e

# Vercel deploys production on every merge to main, outside Actions, and
# reports each deployment back to GitHub. A successful production deployment
# is what runs test-e2e.mjs against chipvoice.dev: the package from npm, the
# API and the editor, byte for byte. Before this it ran only when someone
# remembered to.
on:
  deployment_status:
  workflow_dispatch:

# One run at a time: two deployments close together would otherwise race each
# other's writes into the rate limiter.
concurrency:
  group: production-e2e
  cancel-in-progress: false

jobs:
  e2e:
    # A future second app in this monorepo (gamesounds) gets its own Vercel
    # project. Checked against real GitHub Deployments on 2026-09-28
    # (`gh api repos/gwendall/chipvoice/deployments?environment=Production`
    # and each one's `/statuses`): with a single Vercel project linked,
    # deployment.environment is plain "Production" (deployment 6704106722,
    # environment_url https://chipvoice-8287j9rdn-kamirobotics.vercel.app).
    # During the window this repo also had chipvoice-api linked, 2026-09-04,
    # every project's environment name was disambiguated instead, as the
    # word "Production", a space, the Unicode character U+2013 (never typed
    # literally in this repo), a space, then the project name: chipvoice's
    # own became that shape with "chipvoice" (deployment 6262924288) and
    # chipvoice-api's became that shape with "chipvoice-api" (deployment
    # 6262917790). So gamesounds landing is expected to rename chipvoice's
    # own environment the same way. The check below matches both forms
    # without spelling out U+2013: "Production" on its own, or a value that
    # starts with "Production " and ends with " chipvoice" - which also
    # excludes "Production <U+2013> chipvoice-api" and any future
    # "Production <U+2013> gamesounds", since neither ends with "chipvoice".
    # environment_url does NOT distinguish the two existing projects:
    # chipvoice-api's environment_url that same day was
    # https://chipvoice-65jcghiuf-kamirobotics.vercel.app, the same
    # "https://chipvoice-<hash>-kamirobotics.vercel.app" host pattern as
    # chipvoice's own, and neither is ever the custom domain chipvoice.dev -
    # so deployment.environment is the only field that reliably names the
    # project.
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && (github.event.deployment.environment == 'Production' || (startsWith(github.event.deployment.environment, 'Production ') && endsWith(github.event.deployment.environment, ' chipvoice'))))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The e2e stores a song and forks it. With the dedicated test account's
      # key those writes are that account's; without it they are anonymous.
      - name: Run the e2e against chipvoice.dev
        env:
          SITE: https://chipvoice.dev
          CHIPVOICE_E2E_KEY: ${{ secrets.CHIPVOICE_E2E_KEY }}
        run: |
          if [ -z "$CHIPVOICE_E2E_KEY" ]; then
            echo "::warning::CHIPVOICE_E2E_KEY is not set, so this run writes anonymously"
          fi
          pnpm test:e2e
