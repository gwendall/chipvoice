name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

# Qualify the newest PR revision once; a push to its branch does not also run
# another workflow. Keep main checks even if another main commit arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Static and unit checks: scores, arrangements, mixing, MIDI import,
  # typecheck, package unit tests. None of this touches a browser, so it only
  # needs the package build, not the much slower Next.js build.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter chipvoice build
      # The web typecheck imports the catalogues and render workers the web
      # build writes to the ignored `generated/`; this is that step alone,
      # without `next build`.
      - run: node scripts/build-renderer.mjs
        working-directory: apps/web
      - run: pnpm scores:check
      - run: pnpm arrangements:check
      - run: node scores/test-portable-timbres.mjs
      - run: node scores/mixing/check-calibration.mjs
      - run: node scores/mixing/acceptance.mjs
      - run: node scores/mixing/validate-profiles.mjs
      - name: Score import regressions
        run: |
          python3 -m venv /tmp/chipvoice-score-tools
          /tmp/chipvoice-score-tools/bin/pip install -q -r scores/requirements.txt
          /tmp/chipvoice-score-tools/bin/python scores/test-import-midi.py
      - run: pnpm typecheck
      - run: pnpm test:unit

  # The web browser suite: production Next, anonymous API flows, measured
  # browser audio and editor recovery. Split from `unit` so a late failure
  # here (the slowest part of the old chain) does not also delay the fast
  # checks, and vice versa.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      # The binaries are the slow part of `playwright install`; caching them
      # skips that download on a cache hit. The apt step still runs every
      # time - it is quick once the packages are already there, and there is
      # no flag to ask Playwright to install browsers only when missing.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      # Production Next, anonymous API flows, measured browser audio and editor
      # recovery. Owns its server and temporary SQLite DB; never touches prod.
      - name: Audio publication verifier
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      # The published recordings live in object storage (decision 40). Their
      # keys never change, so a cache keyed on the two reports downloads only
      # what a new publication adds; the pull verifies every file's hash and
      # the check fails a report that names a recording nobody uploaded.
      - uses: actions/cache@v6
        with:
          path: |
            apps/web/public/lab-data/*/
            apps/web/public/arrangement-data/*.flac
          key: audio-${{ hashFiles('apps/web/public/lab-data/report.json', 'apps/web/public/arrangement-data/report.json') }}
          restore-keys: audio-
      - run: pnpm audio:pull
      - run: pnpm audio:check
      - run: pnpm --filter chipvoice-web test
      # Uploaded for a post-mortem, not for a routine pass: it is 22 MB and
      # nobody opens it when the run is green. A short retention because a
      # failing run gets attention (and a fix or a re-run) within days, not
      # weeks.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: demo-evaluation
          path: |
            .artifacts/progressive
            .artifacts/interaction-latency
            .artifacts/player
            .artifacts/demo
            .artifacts/lab
            .artifacts/continuity
            .artifacts/composition
            .artifacts/japanese-playground
            .artifacts/native-songs/browser
            .artifacts/arrangements/browser
            .artifacts/midi-import/e2e
            .artifacts/unified-playground
            .artifacts/cold-review/browser
            .artifacts/timbre-review/browser
            .artifacts/creation/e2e
            .artifacts/artist-lifecycle
            .artifacts/agent-guide
            .artifacts/prompt-composition
            .artifacts/onboarding
            .artifacts/session
            .artifacts/creator-journey
            .artifacts/i18n
          retention-days: 3

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter chipvoice build
      # Independent from browser qualification: neither suite queues behind
      # the other, while keeping all five reference cores and hardware ROMs.
      - run: pnpm --filter chipvoice-conform check
      - run: pnpm --filter chipvoice-conform check:mesen
      - run: pnpm --filter chipvoice-conform roms
      - run: pnpm --filter chipvoice-conform check:dmg
      - run: pnpm --filter chipvoice-conform roms:dmg
      - run: pnpm --filter chipvoice-conform check:md
      - run: pnpm --filter chipvoice-conform check:sn76496
      - run: pnpm --filter chipvoice-conform test:listening
      - run: pnpm --filter chipvoice-conform check:snes
      - run: pnpm --filter chipvoice-conform check:c64
      - run: pnpm --filter chipvoice-conform roms:c64
      - run: pnpm --filter chipvoice-conform mixer
