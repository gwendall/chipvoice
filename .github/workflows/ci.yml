name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

# Qualify the newest PR revision once; a push to its branch does not also run
# another workflow. Keep main checks even if another main commit arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Static and unit checks: scores, arrangements, mixing, MIDI import,
  # typecheck, package unit tests. None of this touches a browser, so it only
  # needs the package build, not the much slower Next.js build.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter chipvoice build
      # apps/web imports web-kit/*, resolved against its built dist/; build it
      # too, before anything below bundles or typechecks apps/web.
      - run: pnpm --filter web-kit build
      # The web typecheck imports the catalogues and render workers the web
      # build writes to the ignored `generated/`; this is that step alone,
      # without `next build`.
      - run: node scripts/build-renderer.mjs
        working-directory: apps/web
      - run: pnpm scores:check
      - run: pnpm arrangements:check
      - run: node scores/test-portable-timbres.mjs
      - run: node scores/mixing/check-calibration.mjs
      - run: node scores/mixing/acceptance.mjs
      - run: node scores/mixing/validate-profiles.mjs
      - run: node scores/instruments/test-presets.mjs
      - run: node scores/instruments/check-catalogue.mjs
      - name: Score import regressions
        run: |
          python3 -m venv /tmp/chipvoice-score-tools
          /tmp/chipvoice-score-tools/bin/pip install -q -r scores/requirements.txt
          /tmp/chipvoice-score-tools/bin/python scores/test-import-midi.py
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm --filter chipvoice-conform test:unit
      - run: pnpm --filter chipvoice-conform accuracy-data:check

  # MIX-14: Node/Chromium/Firefox/WebKit render-hash parity for a fixed set
  # of arrangement excerpts and instrument presets across all five chips.
  # All three desktop engines run here, not only Chromium - Playwright's
  # Linux WebKit still runs JavaScriptCore and Firefox runs SpiderMonkey,
  # exactly the engines where a Math.* difference would show. Its own job so
  # a Playwright download never blocks the browser-free `unit` checks, and
  # this job never blocks them either. The physical-phone/real-Safari leg
  # stays a one-minute human check at /lab/render-parity; see
  # docs/RENDER-PARITY.md. The self-test right after the check proves the
  # gate actually catches a real difference, by planting one and asserting
  # it is caught. Measured locally: the three-engine check takes about a
  # minute and the self-test about 30 seconds, comfortably inside this job's
  # 15-minute budget even on CI's slower, colder hardware.
  render-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter chipvoice build
      # A cache key of its own: the `browser` job below only ever installs
      # Chromium, and sharing one key between a Chromium-only cache and this
      # job's three-engine cache would race whichever job saves first.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-parity-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm render-parity:check
      - run: pnpm render-parity:self-test

  # The web browser suite: production Next, anonymous API flows, measured
  # browser audio and editor recovery. Split from `unit` so a late failure
  # here (the slowest part of the old chain) does not also delay the fast
  # checks, and vice versa.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      # The binaries are the slow part of `playwright install`; caching them
      # skips that download on a cache hit. The apt step still runs every
      # time - it is quick once the packages are already there, and there is
      # no flag to ask Playwright to install browsers only when missing.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      # Production Next, anonymous API flows, measured browser audio and editor
      # recovery. Owns its server and temporary SQLite DB; never touches prod.
      - name: Audio publication verifier
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      # The published recordings live in object storage (decision 40). Their
      # keys never change, so a cache keyed on the two reports downloads only
      # what a new publication adds; the pull verifies every file's hash and
      # the check fails a report that names a recording nobody uploaded.
      - uses: actions/cache@v6
        with:
          path: |
            apps/web/public/lab-data/*/
            apps/web/public/arrangement-data/*.flac
          key: audio-${{ hashFiles('apps/web/public/lab-data/report.json', 'apps/web/public/arrangement-data/report.json') }}
          restore-keys: audio-
      - run: pnpm audio:pull
      - run: pnpm audio:check
      - run: pnpm --filter chipvoice-web test
      # Uploaded for a post-mortem, not for a routine pass: it is 22 MB and
      # nobody opens it when the run is green. A short retention because a
      # failing run gets attention (and a fix or a re-run) within days, not
      # weeks.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: demo-evaluation
          path: |
            .artifacts/progressive
            .artifacts/interaction-latency
            .artifacts/player
            .artifacts/demo
            .artifacts/lab
            .artifacts/continuity
            .artifacts/composition
            .artifacts/japanese-playground
            .artifacts/native-songs/browser
            .artifacts/arrangements/browser
            .artifacts/midi-import/e2e
            .artifacts/unified-playground
            .artifacts/cold-review/browser
            .artifacts/timbre-review/browser
            .artifacts/creation/e2e
            .artifacts/artist-lifecycle
            .artifacts/agent-guide
            .artifacts/prompt-composition
            .artifacts/onboarding
            .artifacts/session
            .artifacts/creator-journey
            .artifacts/i18n
          retention-days: 3

  # gamesounds.ai: a network-free catalogue build, schema/API/runtime unit
  # tests, the CLI and a browser smoke test. Its own job so a Playwright run
  # here never queues behind chipvoice's own render-parity or conformance
  # suites, and vice versa; independent of `build-renderer.mjs` and the
  # chipvoice engine build the `unit`/`browser` jobs need, since apps/sounds
  # imports packages/gamesounds's types by relative path rather than
  # depending on either package's own build (decision 49). gamesounds is our
  # own sound bank - every sound is rendered by chipvoice itself, no
  # third-party sounds and no external generation API (decision 50) - so
  # this job has no source to distrust and nothing to download: the whole
  # catalogue is rebuilt from committed recipes and checked for determinism
  # below, not just a subset.
  sounds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/sounds imports web-kit/*, resolved against its built dist/;
      # pnpm --filter bypasses turbo.json's own build-order graph (decision
      # 47), so build it explicitly first, same as the `unit`/`browser` jobs
      # do for apps/web.
      - run: pnpm --filter web-kit build
      - run: pnpm --filter gamesounds typecheck
      - run: pnpm --filter gamesounds test:unit
      - run: pnpm --filter gamesounds-site typecheck
      # build-catalog.mjs's encode step shells out to ffmpeg (packages/chipvoice's
      # own renderSfx does not need it, but trimming/encoding every variant to
      # .ogg/.mp3/.wav does) - not preinstalled on ubuntu-latest, same gap the
      # `browser` job's own "Audio publication verifier" step papers over for
      # apps/web.
      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      # CI has no license to trust that whatever ffmpeg ships on the runner
      # re-encodes bytes identically to the author's own machine, so it never
      # serves the committed catalog.json as-is. Instead it rebuilds the
      # whole catalogue fresh (network-free: packages/chipvoice's own
      # synthesis is the only source) and check-determinism.mjs proves the
      # fresh build's WAV/PCM hashes - each variant's own identity, produced
      # before any format-specific encoder runs - equal the COMMITTED
      # catalog.json's entries for every sound. See docs/GAMESOUNDS.md/docs/DECISIONS.md
      # for the full design.
      - run: pnpm --filter gamesounds-site catalog:build -- --out .artifacts/ci-catalog.json
      - run: pnpm --filter gamesounds-site catalog:check-determinism -- .artifacts/ci-catalog.json
      # ogg/mp3 are NOT proven byte-identical across ffmpeg builds/platforms
      # (only the WAV/PCM layer just got that guarantee above), so the site
      # this job builds and tests serves the catalogue it just rendered
      # itself, not the one committed from the author's own machine - the
      # CI-built catalogue becomes the site's generated/catalog.json for
      # every remaining step in this job.
      - run: cp apps/sounds/.artifacts/ci-catalog.json apps/sounds/generated/catalog.json
      - run: pnpm --filter gamesounds-site test
      - run: pnpm --filter gamesounds-site build
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      # test-e2e.mjs owns the production server itself (a free port, polled
      # readiness, closed in a `finally`) - the same pattern as apps/web's
      # own test-local.mjs - then runs test-smoke.mjs and
      # packages/gamesounds/test-cli.mjs against it.
      - run: pnpm --filter gamesounds-site test:e2e

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter chipvoice build
      # Independent from browser qualification: neither suite queues behind
      # the other, while keeping all five reference cores and hardware ROMs.
      - run: pnpm --filter chipvoice-conform check
      - run: pnpm --filter chipvoice-conform check:mesen
      - run: pnpm --filter chipvoice-conform roms
      # NEXT-14's first expansion-audio chip: VRC6 against Game_Music_Emu's
      # Nes_Vrc6_Apu, its own native build under
      # packages/conform/oracles/game-music-emu (not the nsf-corpus/gbs-corpus
      # oracle cached below, a different build directory at the same pin).
      - run: pnpm --filter chipvoice-conform check:vrc6
      # Round 2's second, independent oracle (Mesen 2's own vendored VRC6
      # audio, packages/conform/oracles/mesen): same no-regression gate on the
      # full, duty-generator-active corpus as check:vrc6 above.
      - run: pnpm --filter chipvoice-conform check:vrc6-mesen
      # Round 3 patched this oracle's pulse to adopt chipvoice's own
      # nesdev-literal duty-phase reading (Vrc6Pulse.h's "chipvoice patch"
      # comment has the mechanism); round 4: that patch changes this oracle's
      # observable output, so this gate is not independent evidence on duty
      # phase itself, only on everything else the patch does not touch
      # (divider cadence, step timing, freeze while disabled, re-anchoring at
      # each enable edge, levels) - docs/chips/vrc6.md's "The pulse mapping"
      # has the full account. Five scripts (the four flat-corpus pulse
      # scripts that never touch the sawtooth's own disable/re-enable gap,
      # plus script-saw-worked-example once round 4 fixed the harness bug
      # clipping its last edge) are held exact, not just no-regression, on
      # top of the baseline above.
      - run: pnpm --filter chipvoice-conform check:vrc6-flat-mesen
      # Round 2's exact corpus split (docs/chips/vrc6.md's own "Digital
      # parity" section explains why): `core` scripts never disable after
      # their first enable, never touch $9003, and never use a period at or
      # below 4 - the one path both oracles model identically to this core -
      # so both are held to a literal 100%, not a baseline. `edge` scripts
      # (disable/re-enable, $9003, tiny periods) are exact only against
      # Mesen, which models all three; Game_Music_Emu's own documented gaps
      # there (freeze-not-zero on disable, dropping $9003 silently) make an
      # exact gate against it meaningless, so that pairing is report-only.
      - run: pnpm --filter chipvoice-conform check:vrc6-core
      - run: pnpm --filter chipvoice-conform check:vrc6-core-mesen
      - run: pnpm --filter chipvoice-conform check:vrc6-edge-mesen
      - run: pnpm --filter chipvoice-conform check:vrc6-edge-report
      # NEXT-15's AY-3-8910/YM2149, first hosted as the Sunsoft 5B, against
      # two independent oracles (Ayumi and Game_Music_Emu's Ay_Apu), on the
      # same core/edge split VRC6 uses above, drawn on a stricter line
      # (docs/chips/sunsoft5b.md's own "Digital parity" section explains
      # why): `core` (every channel's mixer bits disable both generators,
      # DAC mode - the one path with no known disagreement between the two
      # oracles) is held to a literal 100% against both. `edge` (tone, noise
      # and the envelope actually running) is exact against Ayumi on the
      # full corpus: the noise generator's 17-bit LFSR is the Fibonacci form
      # (decision 48; MAME's own hardware-verified construction, which
      # Ayumi shares), not the Galois form an earlier version of this ticket
      # used. `edge` stays report-only against Game_Music_Emu throughout,
      # since its own tone/noise timing carries a phase delta forward from
      # its reset default rather than restarting cleanly at a write, and it
      # still uses the Galois form for noise, undocumented as hardware-
      # verified on that point.
      - run: pnpm --filter chipvoice-conform check:ay8910-core
      - run: pnpm --filter chipvoice-conform check:ay8910-core-gme
      - run: pnpm --filter chipvoice-conform check:ay8910-edge
      - run: pnpm --filter chipvoice-conform check:ay8910-edge-gme-report
      - run: pnpm --filter chipvoice-conform check:dmg
      - run: pnpm --filter chipvoice-conform check:sameboy
      - run: pnpm --filter chipvoice-conform roms:dmg
      - run: pnpm --filter chipvoice-conform roms:cpu-instrs
      - run: pnpm --filter chipvoice-conform check:md
      - run: pnpm --filter chipvoice-conform check:sn76496
      - run: pnpm --filter chipvoice-conform test:listening
      - run: pnpm --filter chipvoice-conform check:snes
      - run: pnpm --filter chipvoice-conform check:spc
      - run: pnpm --filter chipvoice-conform check:spc-export
      - run: pnpm --filter chipvoice-conform check:spc-export:self-test
      - run: pnpm --filter chipvoice-conform check:c64
      - run: pnpm --filter chipvoice-conform check:residfp-8580
      - run: pnpm --filter chipvoice-conform roms:c64
      # Klaus Dormann's 6502 functional test and Bruce Clark's decimal-mode
      # test run against chipvoice's own Cpu6510 (the PSID/RSID player's
      # CPU), not an oracle, since each program verifies itself.
      - run: pnpm --filter chipvoice-conform check:6510
      - run: pnpm --filter chipvoice-conform mixer
      - run: pnpm --filter chipvoice-conform bench:nes:selftest
      # The real-NSF corpus (P1-12) builds the pinned Game_Music_Emu oracle
      # from source; caching its clone+build by the pinned revision leaves
      # only an incremental cmake build and the small render harness to
      # compile on a cache hit.
      - uses: actions/cache@v6
        with:
          path: .artifacts/nsf-corpus/gme-oracle/gme
          key: gme-oracle-fe8da4b6d3876d7542c2fb69d94487e19836d678
      - run: pnpm nsf-corpus:check
      # Same oracle, the other direction (NEXT-10): does exportNsf's own
      # output play correctly in it. Shares the cache step above by using
      # the same .artifacts/nsf-corpus/gme-oracle path.
      - run: pnpm nsf-export:check
      # The real-GBS corpus (NEXT-06) builds the same pinned Game_Music_Emu
      # revision, into its own clone (a different oracle module, GBS vs
      # NSF), so it gets its own cache entry at the same pin.
      - uses: actions/cache@v6
        with:
          path: .artifacts/gbs-corpus/gme-oracle/gme
          key: gme-oracle-gbs-fe8da4b6d3876d7542c2fb69d94487e19836d678
      - run: pnpm gbs-corpus:check
      # Same oracle, the other direction (NEXT-10): does exportGbs's own
      # output play correctly in it. Shares the cache step above by using
      # the same .artifacts/gbs-corpus/gme-oracle path.
      - run: pnpm gbs-export:check
      # The PSID/RSID corpus (NEXT-09) builds a pinned libsidplayfp (plus a
      # second pinned dependency, xa65, to assemble its own driver) from
      # source; caching both clones and the incremental build directory by
      # their pinned revisions leaves only an incremental build and the
      # small write-logging harness to compile on a cache hit.
      - uses: actions/cache@v6
        with:
          path: .artifacts/psid-corpus/sidplayfp-oracle
          key: psid-oracle-ecd932b3ef87746008472bc7e65b0c419a483e02-3be092964c80b10564f600325b1e4ff455387140
      - run: pnpm psid-corpus:check
