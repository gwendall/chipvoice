<!doctype html>
<meta charset="utf-8">
<title>chipvoice from npm</title>
<button id="go">go</button>
<script type="module">
/*
 * Imports the installed package, not the source.
 *
 * A demo that reaches into src/ proves the source works and says nothing about
 * what `npm install chipvoice` actually gives somebody - which is the only
 * thing a user ever sees.
 */
import { Chip } from "./node_modules/chipvoice/dist/index.js";

window.ready = false;
document.getElementById("go").onclick = async () => {
  const chip = await Chip.create();
  window.chip = chip;
  chip.play({
    id: "smoke", bpm: 152, order: [0], gain: 1,
    patterns: [{
      bass:  "A1 . A1 . A1 . A1 . A1 . A1 . A1 . G1 .",
      lead:  "E4 . . . G4 . A4 . . . B4 . C5 . . .",
      chord: "A3 . . . . . . . . . . . . . . .",
      chordShape: [[0, 3, 7]],
      perc:  "K . H . S . H . K . H K S . H .",
    }],
    lead: { duty: 1, volume: [15, 14, 13, 12, 11], sustain: true },
    chord: { duty: 0, volume: [9, 8, 7], sustain: true },
    bass: { volume: [15], sustain: true },
  });
  window.ready = true;
};
</script>
